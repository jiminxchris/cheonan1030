const $=id=>document.getElementById(id);
const deck=$('deck');let current=0,playing=false,timer=null,lastWheel=0,touchStart=null,toastTimer;
function make(){images.forEach((src,i)=>{let s=document.createElement('section');s.className='slide'+(i===0?' active':'');s.setAttribute('aria-label',`${i+1}번 슬라이드: ${titles[i]}`);let im=document.createElement('img');im.src=src;im.alt=`원본 PPT 슬라이드 ${i+1}: ${titles[i]}. ${subtitles[i]}`;im.loading=i<2?'eager':'lazy';im.draggable=false;s.append(im);(hotspots[i+1]||[]).forEach(([x,y,w,h,t,d])=>{let b=document.createElement('button');b.className='hotspot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.setAttribute('aria-label',`${t} 자세히 보기`);b.title=t;b.onclick=e=>{e.stopPropagation();showToast(t,d)};s.append(b)});deck.append(s);let p=document.createElement('button');p.className='dot'+(i===0?' active':'');p.title=`${i+1}. ${titles[i]}`;p.setAttribute('aria-label',`${i+1}번 슬라이드로 이동`);p.onclick=()=>go(i);$('progress').append(p);let thumb=document.createElement('button');thumb.className='thumb'+(i===0?' selected':'');thumb.innerHTML=`<img src="${src}" alt=""><span><b>${String(i+1).padStart(2,'0')} / 10</b>${titles[i]}</span>`;thumb.onclick=()=>{go(i);toggleMenu(false)};$('thumbs').append(thumb)});update()}
function update(){const all=[...deck.children];all.forEach((s,i)=>{s.classList.toggle('active',i===current);s.classList.toggle('before',i<current);s.setAttribute('aria-hidden',i===current?'false':'true');s.querySelectorAll('.hotspot').forEach(b=>b.tabIndex=i===current?0:-1)});[...$('progress').children].forEach((e,i)=>e.classList.toggle('active',i===current));[...$('thumbs').children].forEach((e,i)=>e.classList.toggle('selected',i===current));$('counter').textContent=`${String(current+1).padStart(2,'0')} / 10`;$('title').textContent=titles[current];$('section').textContent=subtitles[current];$('prev').disabled=current===0;$('next').disabled=current===9;hideToast();if(playing)resetAuto()}
function go(i){let next=Math.max(0,Math.min(9,i));if(next===current)return;current=next;update()}
function showToast(t,d){clearTimeout(toastTimer);$('toasttitle').textContent=t;$('toastbody').textContent=d;$('toast').classList.add('show');if(playing)stopAuto()}
function hideToast(){$('toast').classList.remove('show')}
function toggleMenu(force){let open=force===undefined?!$('drawer').classList.contains('open'):force;$('drawer').classList.toggle('open',open);$('overlay').classList.toggle('open',open);if(open&&playing)stopAuto()}
function stopAuto(){playing=false;clearInterval(timer);$('play').textContent='▶ 자동재생';$('play').classList.remove('active');deck.classList.remove('auto')}
function resetAuto(){clearInterval(timer);deck.classList.remove('auto');void deck.offsetWidth;deck.classList.add('auto');timer=setInterval(()=>{if(current===9)go(0);else go(current+1)},8000)}
function toggleAuto(){if(playing){stopAuto()}else{playing=true;$('play').textContent='Ⅱ 일시정지';$('play').classList.add('active');resetAuto()}}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('mprev').onclick=()=>go(current-1);$('mnext').onclick=()=>go(current+1);$('menu').onclick=()=>toggleMenu();$('closemenu').onclick=()=>toggleMenu(false);$('overlay').onclick=()=>toggleMenu(false);$('closetoast').onclick=hideToast;$('play').onclick=toggleAuto;$('screen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideToast();toggleMenu(false)}if($('drawer').classList.contains('open'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0);if(e.key==='End')go(9);if(e.key.toLowerCase()==='f'&&!e.ctrlKey)$('screen').click()});
document.addEventListener('wheel',e=>{if($('drawer').classList.contains('open')||$('toast').classList.contains('show')||Math.abs(e.deltaY)<12)return;let now=Date.now();if(now-lastWheel<680)return;lastWheel=now;go(current+(e.deltaY>0?1:-1))},{passive:true});
deck.addEventListener('touchstart',e=>{touchStart={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}},{passive:true});deck.addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].screenX-touchStart.x,dy=e.changedTouches[0].screenY-touchStart.y;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.2)go(current+(dx<0?1:-1));touchStart=null},{passive:true});
deck.addEventListener('click',e=>{if(e.target===deck||e.target.tagName==='IMG')hideToast()});setTimeout(()=>$('hint').classList.add('fade'),6500);make();
</script></body></html>
